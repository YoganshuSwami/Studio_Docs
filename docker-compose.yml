version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: studiodoc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: studiodoc
      MYSQL_USER: studiodoc_user
      MYSQL_PASSWORD: studiodoc_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: studiodoc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
